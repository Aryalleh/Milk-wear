<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مانیفست بارگیری</title>
  <script src="/assets/vendor/tailwind.js"></script>
  <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
  <style>
    @font-face{font-family:'Vazirmatn';src:url('/assets/fonts/Vazirmatn.ttf') format('truetype');font-weight:100 900;font-display:swap;}
    body { font-family:'Vazirmatn',sans-serif; background:#f1f5f9; }
    .receipt-card { background:#fff; border-radius:24px; box-shadow:0 10px 25px -5px rgba(0,0,0,.08); }
    @media print {
      .no-print{ display:none!important; }
      body{ background:#fff!important; padding:0; }
      .receipt-card{ box-shadow:none!important; border-radius:0; }
      .receipt-card *{ color:#000!important; background:transparent!important; border-color:#000!important; box-shadow:none!important; }
      @page{ margin:6mm; }
    }
  </style>
</head>
<body class="p-4 pb-28">
  <header class="no-print flex items-center justify-between mb-6 max-w-md mx-auto">
    <button onclick="history.length>1?history.back():window.close()" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-slate-500 shadow-sm"><i class="fa-solid fa-chevron-right"></i></button>
    <h1 class="font-black text-slate-800">مانیفست بارگیری</h1>
    <span class="w-10"></span>
  </header>
  <main id="card" class="receipt-card p-6 relative overflow-hidden max-w-md mx-auto"><div class="text-center text-slate-400 py-16">در حال بارگذاری…</div></main>
  <footer class="no-print fixed bottom-0 left-0 right-0 p-4 bg-white/85 backdrop-blur-md flex gap-3 max-w-md mx-auto">
    <button onclick="window.print()" class="flex-1 bg-blue-700 text-white py-4 rounded-2xl font-black shadow-lg flex items-center justify-center gap-2"><i class="fa-solid fa-print"></i> چاپ مانیفست</button>
  </footer>
<script>
  const fmt=(n)=>Number(n||0).toLocaleString('fa-IR');
  (async()=>{ const card=document.getElementById('card');
    try{
      const [m,branches,LOGO]=await Promise.all([
        fetch('/api/orders/manifest',{credentials:'same-origin'}).then(r=>{ if(!r.ok) throw new Error('عدم دسترسی به مانیفست'); return r.json(); }),
        fetch('/api/branches',{credentials:'same-origin'}).then(r=>r.ok?r.json():[]).catch(()=>[]),
        fetch('/api/public/logo').then(r=>r.ok?r.json():{}).then(x=>x.logo).catch(()=>null),
      ]);
      const b=branches[0]||{};
      const rows=(m.items||[]).map(i=>`<div class="flex justify-between items-center"><div><h3 class="font-bold text-slate-800 text-sm">${i.product_name}</h3><p class="text-[10px] text-slate-400">ارزش: ${fmt(i.amount)} ریال</p></div><span class="font-black text-blue-700 text-base">${fmt(i.qty)} ${i.unit||''}</span></div>`).join('');
      card.innerHTML=`
        <div class="absolute -top-3 left-0 right-0 flex justify-around">${'<div class="w-6 h-6 rounded-full bg-[#f1f5f9]"></div>'.repeat(5)}</div>
        <div class="text-center mt-4 mb-6">
          ${LOGO?`<img src="${LOGO}" class="w-16 h-16 object-contain mx-auto mb-4">`:`<div class="w-16 h-16 bg-blue-50 text-blue-700 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl"><i class="fa-solid fa-truck-ramp-box"></i></div>`}
          <h2 class="text-xl font-black text-slate-800">${b.name||'سامانه لبنیات'}</h2>
          <span class="inline-block mt-2 bg-blue-600 text-white text-xs font-black px-4 py-1 rounded-full">مانیفست</span>
          <p class="text-xs text-slate-400 mt-2">${new Date().toLocaleDateString('fa-IR')}</p>
        </div>
        <div class="space-y-3 border-b border-dashed border-slate-200 pb-6 mb-6 text-sm">
          <div class="flex justify-between"><span class="text-slate-400">تعداد سفارش:</span><span class="font-bold text-slate-800">${fmt(m.order_count)}</span></div>
          <div class="flex justify-between"><span class="text-slate-400">شرح:</span><span class="font-bold text-slate-800">اقلامِ آمادهٔ بارگیری</span></div>
        </div>
        <div class="space-y-4 mb-6">${rows||'<p class="text-center text-slate-400 text-sm">سفارشی برای بار نیست</p>'}</div>
        <div class="bg-slate-50 p-4 rounded-2xl flex justify-between items-center"><span class="font-black text-slate-800">ارزش کل بار:</span><span class="text-lg font-black text-blue-700">${fmt(m.total)} <span class="text-[10px]">ریال</span></span></div>
        <p class="text-[11px] text-slate-400 text-center mt-6">راننده لطفاً اقلام بالا را بار بزند · MILKWEAR</p>`;
    }catch(e){ card.innerHTML='<div class="text-center text-red-500 py-16">'+e.message+'</div>'; }
  })();
</script>
</body>
</html>
