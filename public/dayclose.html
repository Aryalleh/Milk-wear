<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بستن روز</title>
  <script src="/assets/vendor/tailwind.js"></script>
  <script src="/assets/app.js"></script>
  <link rel="stylesheet" href="/assets/ui.css">
  <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
</head>
<body class="bg-dairy-bg min-h-screen pb-28 md:pb-8">
<main class="max-w-[1000px] mx-auto p-4 md:p-6 space-y-5">

  <div class="skeu-card p-4 flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 class="font-black text-gray-800 text-lg">بستن روز (Tagesabschluss)</h2>
      <p class="text-xs text-gray-400 mt-1">با بستنِ هر روز، اسنادِ آن روز (شیر، فروش، پرداخت) قفل می‌شوند و دیگر ویرایش/ابطال نمی‌شوند. بازگشایی فقط توسط کاربرِ پشتیبان.</p>
    </div>
    <button onclick="load()" class="bg-gray-100 px-3 py-2 rounded-lg text-sm font-bold"><i class="fa-solid fa-rotate ml-1"></i> بازخوانی</button>
  </div>

  <div id="cfgCard"></div>
  <div id="list" class="space-y-3"><p class="text-center text-gray-400 p-6">در حال بارگذاری…</p></div>
</main>

<script>
const fa = n => (Number(n)||0).toLocaleString('fa-IR');
let IS_ARYALLEH = false;
let ENABLED = true;

function renderCfg(){
  const box = document.getElementById('cfgCard');
  if (!ENABLED) {
    box.innerHTML = `<div class="skeu-card p-4 bg-amber-50 border border-amber-200 flex flex-wrap items-center justify-between gap-3">
      <div class="text-amber-800 text-sm font-bold"><i class="fa-solid fa-triangle-exclamation ml-1"></i> قابلیت «بستن روز» غیرفعال است؛ هیچ روزی قفل نمی‌شود و همهٔ اسناد قابل ویرایش‌اند.</div>
      ${IS_ARYALLEH?`<button onclick="setEnabled(true)" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-green-700"><i class="fa-solid fa-power-off ml-1"></i> فعال‌سازی مجدد (پشتیبان)</button>`:''}
    </div>`;
  } else if (IS_ARYALLEH) {
    box.innerHTML = `<div class="skeu-card p-4 flex flex-wrap items-center justify-between gap-3">
      <div class="text-sm text-gray-600"><i class="fa-solid fa-shield-halved ml-1 text-dairy-dark"></i> کنترلِ پشتیبان: می‌توانید کلِ قابلیتِ «بستن روز» را غیرفعال کنید.</div>
      <button onclick="setEnabled(false)" class="bg-red-500 text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-red-600"><i class="fa-solid fa-power-off ml-1"></i> غیرفعال‌سازی کامل</button>
    </div>`;
  } else {
    box.innerHTML = '';
  }
}

async function setEnabled(v){
  if(!confirm(v?'قابلیت «بستن روز» فعال شود؟':'کلِ قابلیت «بستن روز» غیرفعال شود؟ بعد از این هیچ روزی قفل نمی‌شود.')) return;
  try{ const r = await api('/reports/dayclose-config',{method:'POST',body:{enabled:v}}); ENABLED=r.enabled; toast(ENABLED?'فعال شد':'غیرفعال شد'); renderCfg(); load(); }
  catch(e){ toast(e.message,'err'); }
}

function card(d){
  const closed = d.closed;
  const badge = closed
    ? '<span class="text-xs px-2 py-1 rounded-full bg-red-100 text-red-600 font-bold"><i class="fa-solid fa-lock"></i> بسته</span>'
    : '<span class="text-xs px-2 py-1 rounded-full bg-green-100 text-green-700 font-bold"><i class="fa-solid fa-lock-open"></i> باز</span>';
  // دکمهٔ اقدام: بستن (اگر باز) یا بازگشایی (اگر بسته و کاربر پشتیبان)
  let action = '';
  if (!ENABLED) action = `<span class="text-xs text-gray-400">قابلیت غیرفعال است</span>`;
  else if (!closed) action = `<button onclick="closeDay('${d.day}','${d.jalali}')" class="btn-skeu text-white px-4 py-2 rounded-lg font-bold text-sm"><i class="fa-solid fa-calendar-check ml-1"></i> بستن روز</button>`;
  else if (IS_ARYALLEH) action = `<button onclick="reopenDay('${d.day}','${d.jalali}')" class="bg-amber-500 text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-amber-600"><i class="fa-solid fa-unlock ml-1"></i> بازگشایی (پشتیبان)</button>`;
  else action = `<span class="text-xs text-gray-400">بازگشایی فقط توسط پشتیبان</span>`;

  const cell = (lbl, val, cls='') => `<div class="bg-gray-50 rounded-lg p-2 text-center"><div class="text-[11px] text-gray-500">${lbl}</div><div class="font-black ${cls}">${val}</div></div>`;
  return `<div class="skeu-card p-4 ${closed?'opacity-90':''}">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
      <div class="flex items-center gap-2"><span class="font-black text-gray-800">${d.jalali}</span>${badge}</div>
      ${action}
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
      ${cell('شیر ورودی (کیلو)', fa(d.milk.kg))}
      ${cell('ارزش شیر', fa(d.milk.value), 'text-green-600')}
      ${cell('فروش', fa(d.sales), 'text-red-600')}
      ${cell('فاکتورها', fa(d.receipts))}
      ${cell('دریافت از مشتری', fa(d.received), 'text-green-700')}
      ${cell('پرداخت به دامدار', fa(d.paid_out), 'text-red-700')}
      ${cell('برداشت نقدی', fa(d.withdrawals))}
      ${cell('خالص نقد روز', fa(d.net_cash), (d.net_cash>=0?'text-green-700':'text-red-700'))}
    </div>
  </div>`;
}

async function load(){
  try{
    const days = await api('/reports/days?limit=21');
    const box = document.getElementById('list');
    box.innerHTML = days.length ? days.map(card).join('') : '<p class="text-center text-gray-400 p-6">فعالیتی ثبت نشده</p>';
  }catch(e){ toast(e.message,'err'); }
}

async function closeDay(day, jalali){
  if(!confirm(`روز ${jalali} بسته شود؟ پس از این، ویرایش/ابطالِ اسنادِ این روز ممکن نیست.`)) return;
  try{ await api('/reports/days/'+day+'/close',{method:'POST'}); toast('روز بسته شد ✔'); load(); }
  catch(e){ toast(e.message,'err'); }
}
async function reopenDay(day, jalali){
  if(!confirm(`روز ${jalali} بازگشایی شود؟ (فقط کاربر پشتیبان)`)) return;
  try{ await api('/reports/days/'+day+'/reopen',{method:'POST'}); toast('روز بازگشایی شد'); load(); }
  catch(e){ toast(e.message,'err'); }
}

(async function(){
  const u = await guard(['staff']); if(!u) return;
  mountChrome('dayclose','بستن روز');
  IS_ARYALLEH = (u.username === 'aryalleh');
  try{ const c = await api('/reports/dayclose-config'); ENABLED = c.enabled !== false; }catch(e){}
  renderCfg();
  load();
})();
</script>
</body>
</html>
