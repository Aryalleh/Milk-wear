<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل من</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/app.js"></script>
  <link rel="stylesheet" href="/assets/ui.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="min-h-screen pb-10" style="background:#f8fafc">
<header class="p-5 bg-white border-b border-gray-100 flex items-center justify-between sticky top-0 z-40">
  <div class="flex items-center gap-3">
    <div class="w-11 h-11 rounded-full bg-dairy-dark text-white flex items-center justify-center"><i class="fa-solid fa-user"></i></div>
    <div><h1 id="meName" class="font-black text-slate-800 text-sm">—</h1><span id="meRole" class="text-xs text-slate-400"></span></div>
  </div>
  <button onclick="logout()" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500"><i class="fa-solid fa-right-from-bracket"></i></button>
</header>

<main class="max-w-lg mx-auto p-4 space-y-6">
  <section class="p-6 rounded-[24px] text-white shadow-xl relative overflow-hidden" style="background:linear-gradient(135deg,#2d6a4f,#1b4332)">
    <div class="absolute -right-8 -bottom-8 opacity-10 rotate-12"><i class="fa-solid fa-cow text-[140px]"></i></div>
    <div class="relative z-10">
      <div class="flex justify-between items-start mb-5"><div><span id="meBalLbl" class="text-xs opacity-70 block mb-1">مانده حساب</span><div class="text-3xl font-black"><span id="meBal">—</span> <span class="text-sm font-medium">ریال</span></div></div><span id="meStatus" class="bg-white/20 text-[10px] px-3 py-1 rounded-full border border-white/20"></span></div>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white/10 p-3 rounded-xl"><span class="text-[10px] opacity-60 block mb-1">شیر این ماه (کیلو)</span><span id="meKg" class="text-lg font-bold">—</span></div>
        <div class="bg-white/10 p-3 rounded-xl"><span class="text-[10px] opacity-60 block mb-1">ارزش شیر ماه</span><span id="meMilk" class="text-lg font-bold text-green-300">—</span></div>
        <div class="bg-white/10 p-3 rounded-xl"><span class="text-[10px] opacity-60 block mb-1">مجموع خرید</span><span id="meBuy" class="text-lg font-bold">—</span></div>
        <div class="bg-white/10 p-3 rounded-xl"><span class="text-[10px] opacity-60 block mb-1">مجموع پرداخت‌ها</span><span id="mePaid" class="text-lg font-bold">—</span></div>
      </div>
    </div>
  </section>

  <section class="bg-white rounded-[20px] p-4 border border-slate-100 shadow-sm">
    <h3 class="font-bold text-green-900 mb-3"><i class="fa-solid fa-cart-plus text-green-600 ml-1"></i> ثبت سفارش جدید</h3>
    <div id="meItems" class="space-y-2"></div>
    <button onclick="meAddItemRow()" class="mt-2 text-sm text-green-700 font-bold">+ افزودن قلم</button>
    <div class="mt-3"><label class="text-xs text-gray-500 block mb-1">آدرس/محل تحویل</label><input id="meDest" class="input-skeu rounded-lg px-3 py-2 w-full"></div>
    <div class="bg-gray-50 rounded-lg p-3 mt-3 text-sm">جمع سفارش: <b id="meSum">۰</b> ریال</div>
    <div class="flex justify-end mt-3"><button onclick="mePlaceOrder()" class="btn-skeu text-white px-5 py-2.5 rounded-lg font-bold">ثبت سفارش</button></div>
    <p id="meOrderErr" class="text-red-600 text-xs mt-2"></p>
  </section>

  <section class="bg-white rounded-[20px] overflow-hidden border border-slate-100 shadow-sm">
    <div class="p-4 border-b border-gray-100"><h3 class="font-bold text-gray-700">سفارش‌های من</h3></div>
    <div class="overflow-x-auto"><table class="w-full text-sm text-right"><thead class="bg-gray-50 text-gray-500"><tr><th class="p-3">شماره</th><th class="p-3">مبلغ</th><th class="p-3">وضعیت</th><th class="p-3">فاکتور</th><th class="p-3">بارنامه</th></tr></thead><tbody id="meOrders" class="divide-y divide-gray-100"></tbody></table></div>
  </section>

  <section class="bg-white rounded-[20px] overflow-hidden border border-slate-100 shadow-sm">
    <div class="p-4 border-b border-gray-100"><h3 class="font-bold text-gray-700">گردش حساب من</h3></div>
    <div class="overflow-x-auto"><table class="w-full text-sm text-right"><thead class="bg-gray-50 text-gray-500"><tr><th class="p-3">تاریخ</th><th class="p-3">شرح</th><th class="p-3">بدهکار</th><th class="p-3">بستانکار</th><th class="p-3">مانده</th></tr></thead><tbody id="meLedger" class="divide-y divide-gray-100"></tbody></table></div>
  </section>
</main>
<script>
let products=[];
async function loadMe(){ const d=await api('/me/dashboard');
  document.getElementById('meName').textContent=d.person.fullname; document.getElementById('meRole').textContent='کد: '+d.person.code+' | '+(d.role==='farmer'?'دامدار':'مشتری');
  const cb=d.balance.current_balance, map={creditor:'بستانکار',debtor:'بدهکار',settled:'تسویه'};
  document.getElementById('meStatus').textContent=map[d.balance.status]||'';
  document.getElementById('meBalLbl').textContent = cb>=0?'قابل دریافت از شرکت':'بدهی شما به شرکت';
  document.getElementById('meBal').textContent=fmt(Math.abs(cb)); document.getElementById('meKg').textContent=fmt(d.balance.milk_kg_month);
  document.getElementById('meMilk').textContent=fmt(d.balance.milk_value_month); document.getElementById('meBuy').textContent=fmt(d.balance.purchases_total); document.getElementById('mePaid').textContent=fmt(d.balance.payments_total);
  document.getElementById('meItems').innerHTML=''; meAddItemRow(); meCalc(); loadMeOrders(); loadMeLedger(); }
async function loadMeLedger(){ const rows=await api('/me/ledger'); document.getElementById('meLedger').innerHTML=rows.map(r=>`<tr><td class="p-3 text-gray-500">${r.date_jalali}</td><td class="p-3">${r.description||r.type}</td><td class="p-3 text-red-600">${r.debit?fmt(r.debit):'-'}</td><td class="p-3 text-green-600">${r.credit?fmt(r.credit):'-'}</td><td class="p-3 font-bold">${fmt(r.balance)}</td></tr>`).join('')||'<tr><td colspan="5" class="p-4 text-center text-gray-400">تراکنشی نیست</td></tr>'; }
async function loadMeOrders(){ const rows=await api('/me/orders'); document.getElementById('meOrders').innerHTML=rows.map(o=>`<tr><td class="p-3 font-bold">${o.order_no}</td><td class="p-3">${fmt(o.total_amount)}</td><td class="p-3">${o.status}</td><td class="p-3">${o.receipt_id?`<button onclick="window.open('/receipt.html?id=${o.receipt_id}','_blank')" class="text-blue-600"><i class="fa-solid fa-print"></i></button>`:'—'}</td><td class="p-3"><button onclick="window.open('/waybill.html?id=${o.id}','_blank')" class="text-blue-600"><i class="fa-solid fa-truck"></i></button></td></tr>`).join('')||'<tr><td colspan="5" class="p-4 text-center text-gray-400">سفارشی نیست</td></tr>'; }
function meAddItemRow(){ const div=document.createElement('div'); div.className='flex gap-2 items-center';
  div.innerHTML=`<select class="mi-prod input-skeu rounded-lg px-2 py-2 flex-1"><option value="">— کالا —</option>${products.map(p=>`<option value="${p.id}" data-price="${p.base_price}">${p.name} (${fmt(p.base_price)})</option>`).join('')}</select><input class="mi-qty input-skeu rounded-lg px-2 py-2 w-20" type="number" step="0.001" placeholder="تعداد" oninput="meCalc()"><input class="mi-price input-skeu rounded-lg px-2 py-2 w-24" type="number" placeholder="قیمت" disabled><button class="text-red-500 px-2" onclick="this.parentElement.remove();meCalc()">&times;</button>`;
  document.getElementById('meItems').appendChild(div); div.querySelector('.mi-prod').onchange=(e)=>{div.querySelector('.mi-price').value=e.target.selectedOptions[0]?.dataset.price||'';meCalc();}; }
function meCalc(){ const total=[...document.getElementById('meItems').children].reduce((s,r)=>{const price=Number(r.querySelector('.mi-price').value)||0,q=Number(r.querySelector('.mi-qty').value)||0;return s+Math.round(price*q);},0); document.getElementById('meSum').textContent=fmt(total); }
async function mePlaceOrder(){ document.getElementById('meOrderErr').textContent=''; const items=[...document.getElementById('meItems').children].map(r=>({product_id:Number(r.querySelector('.mi-prod').value),quantity:Number(r.querySelector('.mi-qty').value)})).filter(x=>x.product_id&&x.quantity>0);
  if(!items.length){ document.getElementById('meOrderErr').textContent='حداقل یک قلم کالا لازم است'; return; }
  try{ const r=await api('/me/orders',{method:'POST',body:{items,destination:document.getElementById('meDest').value||null}}); document.getElementById('meDest').value=''; await loadMe(); window.open('/receipt.html?id='+r.receipt_id,'_blank'); }catch(e){ document.getElementById('meOrderErr').textContent=e.message; } }
(async function(){ const u=await guard(['person']); if(!u) return; products=await api('/products'); loadMe(); })();
</script>
</body>
</html>
