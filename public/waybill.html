<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بارنامه</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');
    body { font-family:'Vazirmatn',sans-serif; background:#f1f5f9; }
    .receipt-card { background:#fff; border-radius:24px; box-shadow:0 10px 25px -5px rgba(0,0,0,.08); }
    @media print {
      .no-print{ display:none!important; }
      body{ background:#fff!important; padding:0; }
      .receipt-card{ box-shadow:none!important; border-radius:0; }
      .receipt-card *{ color:#000!important; background:transparent!important; border-color:#000!important; box-shadow:none!important; }
      @page{ margin:6mm; }
    }
  </style>
</head>
<body class="p-4 pb-28">
  <header class="no-print flex items-center justify-between mb-6 max-w-md mx-auto">
    <button onclick="history.length>1?history.back():window.close()" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-slate-500 shadow-sm"><i class="fa-solid fa-chevron-right"></i></button>
    <h1 class="font-black text-slate-800">بارنامه تحویل بار</h1>
    <span class="w-10"></span>
  </header>
  <main id="card" class="receipt-card p-6 relative overflow-hidden max-w-md mx-auto"><div class="text-center text-slate-400 py-16">در حال بارگذاری…</div></main>
  <footer class="no-print fixed bottom-0 left-0 right-0 p-4 bg-white/85 backdrop-blur-md flex gap-3 max-w-md mx-auto">
    <button onclick="window.print()" class="flex-1 bg-blue-700 text-white py-4 rounded-2xl font-black shadow-lg flex items-center justify-center gap-2"><i class="fa-solid fa-print"></i> چاپ بارنامه</button>
  </footer>
<script>
  const fmt=(n)=>Number(n||0).toLocaleString('fa-IR');
  const id=new URLSearchParams(location.search).get('id');
  (async()=>{ const card=document.getElementById('card');
    try{ const r=await fetch('/api/orders/'+id,{credentials:'same-origin'}); if(!r.ok) throw new Error('عدم دسترسی به بارنامه'); const d=await r.json(); const o=d.order;
      const rows=(d.items||[]).map(i=>`<div class="flex justify-between items-center"><div><h3 class="font-bold text-slate-800 text-sm">${i.product_name}</h3><p class="text-[10px] text-slate-400">${fmt(i.quantity)} ${i.unit||''} × ${fmt(i.unit_price)}</p></div><span class="font-black text-slate-700 text-sm">${fmt(i.amount)}</span></div>`).join('');
      card.innerHTML=`
        <div class="absolute -top-3 left-0 right-0 flex justify-around">${'<div class="w-6 h-6 rounded-full bg-[#f1f5f9]"></div>'.repeat(5)}</div>
        <div class="text-center mt-4 mb-6">
          <div class="w-16 h-16 bg-blue-50 text-blue-700 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl"><i class="fa-solid fa-truck-fast"></i></div>
          <h2 class="text-xl font-black text-slate-800">${d.branch?.name||'سامانه لبنیات'}</h2>
          <span class="inline-block mt-2 bg-blue-600 text-white text-xs font-black px-4 py-1 rounded-full">بارنامه</span>
          <p class="text-xs text-slate-400 mt-2">شماره: ${o.waybill_no||o.order_no}</p>
        </div>
        <div class="space-y-3 border-b border-dashed border-slate-200 pb-6 mb-6 text-sm">
          <div class="flex justify-between"><span class="text-slate-400">تحویل‌گیرنده:</span><span class="font-bold text-slate-800">${d.person.fullname} (${d.person.person_code})</span></div>
          <div class="flex justify-between"><span class="text-slate-400">تلفن:</span><span class="font-bold text-slate-800">${d.person.mobile||'—'}</span></div>
          <div class="flex justify-between"><span class="text-slate-400">مقصد تحویل:</span><span class="font-bold text-slate-800 text-left max-w-[60%]">${o.destination||d.person.address||'—'}</span></div>
          <div class="flex justify-between"><span class="text-slate-400">شماره سفارش:</span><span class="font-bold text-slate-800">${o.order_no}</span></div>
        </div>
        <div class="space-y-4 mb-6">${rows||'<p class="text-center text-slate-400 text-sm">قلمی ثبت نشده</p>'}</div>
        <div class="bg-slate-50 p-4 rounded-2xl flex justify-between items-center"><span class="font-black text-slate-800">جمع کل:</span><span class="text-lg font-black text-blue-700">${fmt(o.total_amount)} <span class="text-[10px]">ریال</span></span></div>`;
    }catch(e){ card.innerHTML='<div class="text-center text-red-500 py-16">'+e.message+'</div>'; }
  })();
</script>
</body>
</html>
