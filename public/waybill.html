<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بارنامه</title>
  <script src="/assets/vendor/tailwind.js"></script>
  <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
  <script src="/assets/vendor/qrious.min.js"></script>
  <style>
    @font-face{font-family:'Vazirmatn';src:url('/assets/fonts/Vazirmatn.ttf') format('truetype');font-weight:100 900;font-display:swap;}
    body { font-family:'Vazirmatn',sans-serif; background:#f1f5f9; }
    .receipt-card { background:#fff; border-radius:24px; box-shadow:0 10px 25px -5px rgba(0,0,0,.08); }
    @media print {
      .no-print{ display:none!important; }
      body{ background:#fff!important; padding:0; }
      .receipt-card{ box-shadow:none!important; border-radius:0; }
      .receipt-card *{ color:#000!important; background:transparent!important; border-color:#000!important; box-shadow:none!important; }
      @page{ margin:6mm; }
    }
  </style>
</head>
<body class="p-4 pb-28">
  <header class="no-print flex items-center justify-between mb-6 max-w-md mx-auto">
    <button onclick="history.length>1?history.back():window.close()" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-slate-500 shadow-sm"><i class="fa-solid fa-chevron-right"></i></button>
    <h1 class="font-black text-slate-800">بارنامه تحویل بار</h1>
    <span class="w-10"></span>
  </header>
  <main id="card" class="receipt-card p-6 relative overflow-hidden max-w-md mx-auto"><div class="text-center text-slate-400 py-16">در حال بارگذاری…</div></main>
  <footer class="no-print fixed bottom-0 left-0 right-0 p-4 bg-white/85 backdrop-blur-md flex gap-3 max-w-md mx-auto">
    <button onclick="window.print()" class="flex-1 bg-blue-700 text-white py-4 rounded-2xl font-black shadow-lg flex items-center justify-center gap-2"><i class="fa-solid fa-print"></i> چاپ بارنامه</button>
  </footer>
<script>
  const fmt=(n)=>Number(n||0).toLocaleString('fa-IR');
  const MW_CUR=(window.MW_CUR==='toman')?'toman':'rial', CUR_FA=MW_CUR==='toman'?'تومان':'ریال';
  const money=(r)=>fmt(MW_CUR==='toman'?Math.round(Number(r||0)/10):Number(r||0));
  const id=new URLSearchParams(location.search).get('id');
  (async()=>{ const card=document.getElementById('card');
    try{ const r=await fetch('/api/orders/'+id,{credentials:'same-origin'}); if(!r.ok) throw new Error('عدم دسترسی به بارنامه'); const d=await r.json(); const o=d.order;
      const rows=(d.items||[]).map(i=>`<div class="flex justify-between items-center"><div><h3 class="font-bold text-slate-800 text-sm">${i.product_name}</h3><p class="text-[10px] text-slate-400">${fmt(i.quantity)} ${i.unit||''} × ${money(i.unit_price)}</p></div><span class="font-black text-slate-700 text-sm">${money(i.amount)}</span></div>`).join('');
      // برچسبِ مانده: منفی=بدهکار (به ما بدهکار است)، مثبت=بستانکار، صفر=تسویه
      const balLbl=(b)=>{ b=Number(b||0); return b<0?`${money(-b)} <span class="text-[10px]">بدهکار</span>`:(b>0?`${money(b)} <span class="text-[10px]">بستانکار</span>`:'تسویه'); };
      // وضعیت حساب به‌صورت محاسبهٔ مرحله‌به‌مرحله (بدهی مثبت، طلب منفی) — مثلِ فاکتور
      const acctBox=(a,o)=>{
        const oldD = a&&a.previous!=null ? -Number(a.previous) : -Number(d.balance_before||0);
        const invD = a ? -Number(a.effect||0) : Number(o.total_amount||0);
        const paid = a ? Number(a.paid||0) : 0;
        const newD=oldD+invD, finD=newD-paid;
        const A=(v)=> v===0?'۰':`${money(Math.abs(v))} <span class="text-[10px] font-bold">${CUR_FA}</span>`;
        const row=(sign,label,val,cls='')=>`<div class="flex justify-between items-center py-1.5 ${cls}"><span class="flex items-center gap-2"><span class="w-5 text-center font-black text-slate-400">${sign}</span><span class="whitespace-nowrap">${label}</span></span><span class="font-bold">${val}</span></div>`;
        return `<div class="border-2 border-slate-800 rounded-2xl p-4 text-sm">
          <h4 class="font-black text-slate-800 mb-2 text-center">وضعیت حساب (${CUR_FA})</h4>
          ${row('', oldD>=0?'بدهی گذشته':'طلب گذشته', A(oldD))}
          ${row('+','جمعِ این بارنامه', money(invD))}
          ${row('=', `<b>${newD>=0?'بدهی جدید با این بارنامه':'طلب جدید با این بارنامه'}</b>`, A(newD), 'border-t border-slate-300 mt-1')}
          ${paid?row('−','پرداختی', `<span class="text-green-700">${money(paid)}</span>`):''}
          <div class="flex justify-between items-center mt-2 pt-2 border-t-2 border-slate-800"><span class="flex items-center gap-2"><span class="w-5 text-center font-black">=</span><span class="font-black text-base">${finD>0?'جمع کل (بدهی نهایی)':finD<0?'طلب نهایی':'حساب تسویه'}</span></span><span class="text-lg font-black ${finD>0?'text-red-600':'text-green-700'}">${A(finD)}</span></div>
        </div>`; };
      const LOGO=await fetch('/api/public/logo').then(r=>r.ok?r.json():{}).then(x=>x.logo).catch(()=>null);
      card.innerHTML=`
        <div class="absolute -top-3 left-0 right-0 flex justify-around">${'<div class="w-6 h-6 rounded-full bg-[#f1f5f9]"></div>'.repeat(5)}</div>
        <div class="text-center mt-4 mb-6">
          ${LOGO?`<img src="${LOGO}" class="w-16 h-16 object-contain mx-auto mb-4">`:`<div class="w-16 h-16 bg-blue-50 text-blue-700 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl"><i class="fa-solid fa-truck-fast"></i></div>`}
          <h2 class="text-xl font-black text-slate-800">لبنیات سنتی کلاچی</h2>
          <span class="inline-block mt-2 bg-blue-600 text-white text-xs font-black px-4 py-1 rounded-full">بارنامه</span>
          <p class="text-xs text-slate-400 mt-2">شماره: ${o.waybill_no||o.order_no}</p>
        </div>
        <div class="space-y-3 border-b border-dashed border-slate-200 pb-6 mb-6 text-sm">
          <div class="flex justify-between"><span class="text-slate-400">تاریخ:</span><span class="font-bold text-slate-800">${o.ordered_at_jalali||'—'}</span></div>
          <div class="flex justify-between"><span class="text-slate-400">تحویل‌گیرنده:</span><span class="font-bold text-slate-800">${d.person.fullname} (${d.person.person_code})</span></div>
          <div class="flex justify-between"><span class="text-slate-400">تلفن:</span><span class="font-bold text-slate-800" dir="ltr">${d.person.mobile||'—'}</span></div>
          <div class="flex justify-between"><span class="text-slate-400">مقصد تحویل:</span><span class="font-bold text-slate-800 text-left max-w-[60%]">${o.destination||d.person.address||'—'}</span></div>
          <div class="flex justify-between"><span class="text-slate-400">شماره سفارش:</span><span class="font-bold text-slate-800">${o.order_no}</span></div>
        </div>
        <div class="space-y-4 mb-6">${rows||'<p class="text-center text-slate-400 text-sm">قلمی ثبت نشده</p>'}</div>
        ${acctBox(d.account, o)}
        <div class="mt-8 text-center"><canvas id="qr" class="mx-auto"></canvas><p id="qrLink" class="text-[10px] text-slate-400 mt-2 font-bold tracking-widest">${d.receipt?'اسکن برای مشاهدهٔ فاکتور · MILKWEAR':'فاکتوری ثبت نشده'}</p></div>`;
      // QRِ بارنامه به فاکتورِ همین سفارش اشاره می‌کند
      if(d.receipt&&d.receipt.public_token){ const qrUrl=location.origin+'/r/'+d.receipt.public_token;
        try{ if(window.QRious){ new QRious({ element:document.getElementById('qr'), value:qrUrl, size:120, foreground:'#000000', background:'#ffffff', level:'M' }); } else { document.getElementById('qrLink').textContent=qrUrl; } }
        catch(err){ document.getElementById('qrLink').textContent=qrUrl; } }
      // چاپ مستقیم: با ?print=1 خودکار پرینت می‌گیرد و پنجره بسته می‌شود
      if(new URLSearchParams(location.search).get('print')==='1'){
        window.addEventListener('afterprint',()=>{ setTimeout(()=>window.close(),200); });
        setTimeout(()=>window.print(),350);
      }
    }catch(e){ card.innerHTML='<div class="text-center text-red-500 py-16">'+e.message+'</div>'; }
  })();
</script>
</body>
</html>
