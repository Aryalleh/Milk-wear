<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انبار</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/app.js"></script>
  <link rel="stylesheet" href="/assets/ui.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-dairy-bg min-h-screen pb-28 md:pb-8">
<main class="max-w-[1100px] mx-auto p-4 md:p-6 space-y-5">
  <!-- فرم‌ها: روی موبایل جمع‌شونده -->
  <details id="formsD" class="skeu-card overflow-hidden">
    <summary class="p-4 font-bold text-gray-700 cursor-pointer flex items-center gap-2 list-none"><i class="fa-solid fa-plus-circle text-green-600"></i> ثبت ورود کالا / تعریف کالای جدید</summary>
    <div class="p-4 pt-0 space-y-6">
      <div>
        <h4 class="font-bold text-sm text-gray-600 mb-3">تعریف کالای جدید</h4>
        <div class="flex flex-wrap gap-3 items-end">
          <div class="flex-1 min-w-[150px]"><label class="text-xs text-gray-500 block mb-1">نام کالا</label><input id="npName" class="input-skeu rounded-lg px-3 py-2 w-full"></div>
          <div><label class="text-xs text-gray-500 block mb-1">دسته</label><select id="npCat" class="input-skeu rounded-lg px-3 py-2"></select></div>
          <div><label class="text-xs text-gray-500 block mb-1">واحد</label><select id="npUnit" class="input-skeu rounded-lg px-3 py-2"></select></div>
          <div><label class="text-xs text-gray-500 block mb-1">قیمت پایه</label><input id="npPrice" type="number" class="input-skeu rounded-lg px-3 py-2 w-32"></div>
          <label class="flex items-center gap-2 text-sm text-gray-600 mb-2"><input id="npTrack" type="checkbox" checked class="w-4 h-4"> ردیابی موجودی</label>
          <button onclick="addProduct()" class="bg-green-600 text-white px-5 py-2 rounded-lg font-bold hover:bg-green-700">افزودن کالا</button>
        </div>
        <p id="npErr" class="text-red-600 text-xs mt-2"></p>
      </div>
      <div class="border-t border-gray-100 pt-4">
        <h4 class="font-bold text-sm text-gray-600 mb-3">ثبت ورود کالا (چیا اومده)</h4>
        <div class="flex flex-wrap gap-3 items-end">
          <div><label class="text-xs text-gray-500 block mb-1">انبار</label><select id="invWh" class="input-skeu rounded-lg px-3 py-2"></select></div>
          <div><label class="text-xs text-gray-500 block mb-1">کالا</label><select id="invProd" class="input-skeu rounded-lg px-3 py-2"></select></div>
          <div><label class="text-xs text-gray-500 block mb-1">مقدار</label><input id="invQty" type="number" step="0.001" class="input-skeu rounded-lg px-3 py-2 w-28"></div>
          <div><label class="text-xs text-gray-500 block mb-1">بهای واحد</label><input id="invCost" type="number" class="input-skeu rounded-lg px-3 py-2 w-32"></div>
          <button onclick="receiveStock()" class="bg-green-600 text-white px-5 py-2 rounded-lg font-bold hover:bg-green-700">ثبت ورود</button>
        </div>
      </div>
    </div>
  </details>

  <!-- دسکتاپ: جدول (طرح ۰۴) -->
  <div class="hidden md:block skeu-card overflow-hidden">
    <div class="p-4 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center flex-wrap gap-2">
      <h3 class="font-bold text-gray-700">موجودی فعلی انبار</h3>
      <div class="flex gap-4">
        <span class="flex items-center gap-2 text-xs text-gray-500"><span class="w-3 h-3 rounded-full bg-green-500"></span> موجودی کافی</span>
        <span class="flex items-center gap-2 text-xs text-gray-500"><span class="w-3 h-3 rounded-full bg-red-500"></span> نیاز به شارژ</span>
      </div>
    </div>
    <div class="overflow-x-auto"><table class="w-full text-sm text-right"><thead class="bg-gray-50 text-gray-500"><tr><th class="p-4">کالا</th><th class="p-4">دسته</th><th class="p-4">واحد</th><th class="p-4">وارد شده</th><th class="p-4">خروج</th><th class="p-4">موجودی فعلی</th></tr></thead><tbody id="invTable" class="divide-y divide-gray-100"></tbody></table></div>
  </div>

  <!-- موبایل: کارت‌ها (طرح ۱۱) -->
  <div class="md:hidden space-y-3" id="invCards"></div>
</main>
<script>
let products=[];
function pct(p){ if(p.total_in>0) return Math.max(4, Math.min(100, Math.round(p.on_hand/p.total_in*100))); return p.on_hand>0?100:0; }
async function loadInventory(){ const [rows,whs,meta]=await Promise.all([api('/inventory'),api('/inventory/warehouses'),api('/products/meta')]);
  // دسکتاپ
  document.getElementById('invTable').innerHTML=rows.map(p=>`<tr><td class="p-4 font-bold">${p.name}</td><td class="p-4">${p.category||'—'}</td><td class="p-4 text-gray-500">${p.unit||''}</td><td class="p-4">${fmt(p.total_in)}</td><td class="p-4">${fmt(p.total_out)}</td><td class="p-4 font-black ${p.on_hand>10?'text-green-600':'text-red-600'}">${fmt(p.on_hand)}</td></tr>`).join('')||'<tr><td colspan="6" class="p-6 text-center text-gray-400">کالایی نیست</td></tr>';
  // موبایل کارتی
  document.getElementById('invCards').innerHTML=rows.map(p=>{ const ok=p.on_hand>10, w=pct(p);
    return `<div class="skeu-card p-4" style="border-radius:20px">
      <div class="flex justify-between items-start mb-4">
        <div class="flex items-center gap-3"><div class="w-10 h-10 ${ok?'bg-blue-50 text-blue-600':'bg-amber-50 text-amber-600'} rounded-xl flex items-center justify-center"><i class="fa-solid fa-box"></i></div>
          <div><h3 class="font-bold text-slate-800 text-sm">${p.name}</h3><span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded">${p.category||'—'}</span></div></div>
        <div class="text-left"><span class="text-xs text-slate-400">موجودی</span><div class="text-lg font-black ${ok?'text-green-600':'text-red-600'}">${fmt(p.on_hand)} <span class="text-[10px]">${p.unit||''}</span></div></div>
      </div>
      <div class="h-1.5 w-full bg-slate-100 rounded-full overflow-hidden"><div class="h-full ${ok?'bg-green-500':'bg-red-500'} rounded-full" style="width:${w}%"></div></div>
      ${ok?'':'<p class="text-[10px] text-red-500 font-bold mt-2"><i class="fa-solid fa-triangle-exclamation ml-1"></i> نیاز به شارژ انبار</p>'}
    </div>`; }).join('')||'<div class="text-center text-gray-400 p-8">کالایی نیست</div>';
  // فرم‌ها
  document.getElementById('invWh').innerHTML=whs.map(w=>`<option value="${w.id}">${w.name}${w.branch_name?(' - '+w.branch_name):''}</option>`).join('');
  document.getElementById('invProd').innerHTML=products.filter(p=>p.track_stock).map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  document.getElementById('npCat').innerHTML=meta.categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  document.getElementById('npUnit').innerHTML=meta.units.map(u=>`<option value="${u.id}">${u.name}</option>`).join(''); }
async function receiveStock(){ try{ await api('/inventory/receive',{method:'POST',body:{warehouse_id:Number(document.getElementById('invWh').value),product_id:Number(document.getElementById('invProd').value),quantity:Number(document.getElementById('invQty').value),unit_cost:document.getElementById('invCost').value||null}}); document.getElementById('invQty').value=document.getElementById('invCost').value=''; loadInventory(); }catch(e){alert(e.message);} }
async function addProduct(){ document.getElementById('npErr').textContent=''; if(!document.getElementById('npName').value.trim()){document.getElementById('npErr').textContent='نام کالا لازم است';return;}
  try{ await api('/products',{method:'POST',body:{name:document.getElementById('npName').value.trim(),category_id:Number(document.getElementById('npCat').value)||null,unit_id:Number(document.getElementById('npUnit').value)||null,base_price:document.getElementById('npPrice').value||0,track_stock:document.getElementById('npTrack').checked}});
    document.getElementById('npName').value=document.getElementById('npPrice').value=''; products=await api('/products'); loadInventory(); }catch(e){ document.getElementById('npErr').textContent=e.message; } }
(async function(){ const u=await guard(['staff']); if(!u) return; mountChrome('inventory','موجودی انبار');
  if(window.innerWidth<768) document.getElementById('formsD').open=false; else document.getElementById('formsD').open=true;
  products=await api('/products'); live(loadInventory, 20000); })();
</script>
</body>
</html>
