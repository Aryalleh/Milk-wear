<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انبار</title>
  <script src="/assets/vendor/tailwind.js"></script>
  <script src="/assets/app.js"></script>
  <link rel="stylesheet" href="/assets/ui.css">
  <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
</head>
<body class="bg-dairy-bg min-h-screen pb-28 md:pb-8">
<main class="max-w-[1100px] mx-auto p-4 md:p-6 space-y-5">
  <!-- دسکتاپ: جدول -->
  <div class="hidden md:block skeu-card overflow-hidden">
    <div class="p-4 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center flex-wrap gap-2">
      <h3 class="font-bold text-gray-700">موجودی فعلی انبار</h3>
      <div class="flex gap-4">
        <span class="flex items-center gap-2 text-xs text-gray-500"><span class="w-3 h-3 rounded-full bg-green-500"></span> موجودی کافی</span>
        <span class="flex items-center gap-2 text-xs text-gray-500"><span class="w-3 h-3 rounded-full bg-red-500"></span> نیاز به شارژ</span>
      </div>
    </div>
    <div class="overflow-x-auto"><table class="w-full text-sm text-right"><thead class="bg-gray-50 text-gray-500"><tr><th class="p-4">کالا</th><th class="p-4">دسته</th><th class="p-4">واحد</th><th class="p-4">وارد شده</th><th class="p-4">خروج</th><th class="p-4">موجودی</th><th class="p-4">حد نرمال</th><th class="p-4">شارژ</th></tr></thead><tbody id="invTable" class="divide-y divide-gray-100"></tbody></table></div>
  </div>
  <!-- موبایل: کارت‌ها -->
  <div class="md:hidden space-y-3" id="invCards"></div>
</main>

<!-- FAB افزودن محصول -->
<button onclick="openProduct()" class="fixed bottom-24 md:bottom-8 left-6 z-40 w-14 h-14 bg-green-700 rounded-full flex items-center justify-center text-white shadow-2xl hover:bg-green-800"><i class="fa-solid fa-plus text-xl"></i></button>

<!-- مودال شارژ محصول -->
<div id="restockModal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-end md:items-center justify-center p-0 md:p-4">
  <div class="bg-white w-full md:max-w-sm rounded-t-2xl md:rounded-2xl p-5">
    <div class="flex justify-between items-center mb-4"><h3 class="font-black text-gray-800">شارژ انبار</h3><button onclick="closeRestock()" class="text-gray-400 text-2xl">&times;</button></div>
    <p id="rsName" class="text-sm text-gray-500 mb-3"></p>
    <div class="space-y-3">
      <div><label class="text-xs text-gray-500 block mb-1">انبار</label><select id="rsWh" class="input-skeu rounded-lg px-3 py-2.5 w-full"></select></div>
      <div><label class="text-xs text-gray-500 block mb-1">مقدار</label><input id="rsQty" type="number" step="0.001" class="input-skeu rounded-lg px-3 py-2.5 w-full"></div>
      <div><label class="text-xs text-gray-500 block mb-1">بهای واحد (اختیاری)</label><input id="rsCost" type="number" class="input-skeu rounded-lg px-3 py-2.5 w-full"></div>
    </div>
    <div class="flex justify-end gap-2 mt-5"><button onclick="closeRestock()" class="bg-gray-100 text-gray-700 px-4 py-2.5 rounded-lg font-bold">انصراف</button><button onclick="saveRestock()" class="btn-skeu text-white px-5 py-2.5 rounded-lg font-bold">ثبت شارژ</button></div>
    <p id="rsErr" class="text-red-600 text-xs mt-2"></p>
  </div>
</div>

<!-- مودال محصول جدید -->
<div id="productModal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-end md:items-center justify-center p-0 md:p-4 overflow-y-auto">
  <div class="bg-white w-full md:max-w-md rounded-t-2xl md:rounded-2xl p-5">
    <div class="flex justify-between items-center mb-4"><h3 class="font-black text-gray-800">تعریف کالای جدید</h3><button onclick="closeProduct()" class="text-gray-400 text-2xl">&times;</button></div>
    <div class="space-y-3">
      <div><label class="text-xs text-gray-500 block mb-1">نام کالا *</label><input id="npName" class="input-skeu rounded-lg px-3 py-2.5 w-full"></div>
      <div class="flex gap-2">
        <div class="flex-1"><label class="text-xs text-gray-500 block mb-1">دسته</label><select id="npCat" class="input-skeu rounded-lg px-3 py-2.5 w-full"></select></div>
        <div class="flex-1"><label class="text-xs text-gray-500 block mb-1">واحد</label><select id="npUnit" class="input-skeu rounded-lg px-3 py-2.5 w-full"></select></div>
      </div>
      <div><label class="text-xs text-gray-500 block mb-1">قیمت پایه (ریال)</label><input id="npPrice" type="number" class="input-skeu rounded-lg px-3 py-2.5 w-full"></div>
      <label class="flex items-center gap-2 text-sm text-gray-600"><input id="npTrack" type="checkbox" checked class="w-4 h-4"> ردیابی موجودی</label>
    </div>
    <div class="flex justify-end gap-2 mt-5"><button onclick="closeProduct()" class="bg-gray-100 text-gray-700 px-4 py-2.5 rounded-lg font-bold">انصراف</button><button onclick="saveProduct()" class="btn-skeu text-white px-5 py-2.5 rounded-lg font-bold">افزودن</button></div>
    <p id="npErr" class="text-red-600 text-xs mt-2"></p>
  </div>
</div>

<script>
let products=[], warehouses=[], meta={categories:[],units:[]}, rsPid=null;
const isDairy=(p)=> p.category==='لبنیات';
async function loadInventory(){ const [rows,whs,m]=await Promise.all([api('/inventory'),api('/inventory/warehouses'),api('/products/meta')]);
  warehouses=whs; meta=m;
  document.getElementById('invTable').innerHTML=rows.map(p=>{ const ok=Number(p.on_hand)>Number(p.reorder_level||0);
    return `<tr><td class="p-4 font-bold">${p.name}</td><td class="p-4">${p.category||'—'}</td><td class="p-4 text-gray-500">${p.unit||''}</td><td class="p-4">${fmt(p.total_in)}</td><td class="p-4">${fmt(p.total_out)}</td><td class="p-4 font-black ${ok?'text-green-600':'text-red-600'}">${fmt(p.on_hand)}</td><td class="p-4"><input type="number" step="0.001" value="${p.reorder_level}" onchange="setReorder(${p.id},this.value)" class="input-skeu rounded-lg px-2 py-1 w-20 text-sm" title="حد نرمال موجودی"></td><td class="p-4">${isDairy(p)?'<span class="text-[10px] text-gray-400">از تولید</span>':`<button onclick="openRestock(${p.id},'${(p.name||'').replace(/'/g,'')}')" class="text-green-700 font-bold text-xs"><i class="fa-solid fa-bolt ml-1"></i>شارژ</button>`}</td></tr>`; }).join('')||'<tr><td colspan="8" class="p-6 text-center text-gray-400">کالایی نیست</td></tr>';
  document.getElementById('invCards').innerHTML=rows.map(p=>{ const ok=Number(p.on_hand)>Number(p.reorder_level||0), w=p.total_in>0?Math.max(4,Math.min(100,Math.round(p.on_hand/p.total_in*100))):(p.on_hand>0?100:0);
    return `<div class="skeu-card p-4" style="border-radius:20px">
      <div class="flex justify-between items-start mb-3">
        <div class="flex items-center gap-3"><div class="w-10 h-10 ${ok?'bg-blue-50 text-blue-600':'bg-amber-50 text-amber-600'} rounded-xl flex items-center justify-center"><i class="fa-solid fa-box"></i></div>
          <div><h3 class="font-bold text-slate-800 text-sm">${p.name}</h3><span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded">${p.category||'—'}</span></div></div>
        <div class="text-left"><span class="text-xs text-slate-400">موجودی</span><div class="text-lg font-black ${ok?'text-green-600':'text-red-600'}">${fmt(p.on_hand)} <span class="text-[10px]">${p.unit||''}</span></div></div>
      </div>
      <div class="h-1.5 w-full bg-slate-100 rounded-full overflow-hidden mb-3"><div class="h-full ${ok?'bg-green-500':'bg-red-500'} rounded-full" style="width:${w}%"></div></div>
      ${isDairy(p)?'<p class="text-[10px] text-gray-400 text-center">لبنیات فقط از طریق تولید وارد انبار می‌شود</p>':`<button onclick="openRestock(${p.id},'${(p.name||'').replace(/'/g,'')}')" class="w-full bg-green-50 text-green-700 py-2 rounded-xl font-bold text-sm"><i class="fa-solid fa-bolt ml-1"></i> شارژ انبار</button>`}
    </div>`; }).join('')||'<div class="text-center text-gray-400 p-8">کالایی نیست</div>'; }
// شارژ
function openRestock(id,name){ rsPid=id; document.getElementById('rsName').textContent='کالا: '+name; document.getElementById('rsErr').textContent=''; document.getElementById('rsQty').value=''; document.getElementById('rsCost').value='';
  document.getElementById('rsWh').innerHTML=warehouses.map(w=>`<option value="${w.id}">${w.name}${w.branch_name?(' - '+w.branch_name):''}</option>`).join(''); document.getElementById('restockModal').classList.remove('hidden'); }
function closeRestock(){ document.getElementById('restockModal').classList.add('hidden'); }
async function setReorder(id, val){ try{ await api('/products/'+id,{method:'PUT',body:{reorder_level:Number(val)||0}}); loadInventory(); }catch(e){ alert(e.message); } }
async function saveRestock(){ document.getElementById('rsErr').textContent=''; const q=Number(document.getElementById('rsQty').value); if(!q||q<=0){document.getElementById('rsErr').textContent='مقدار لازم است';return;}
  try{ await api('/inventory/receive',{method:'POST',body:{warehouse_id:Number(document.getElementById('rsWh').value),product_id:rsPid,quantity:q,unit_cost:document.getElementById('rsCost').value||null}}); closeRestock(); loadInventory(); }catch(e){ document.getElementById('rsErr').textContent=e.message; } }
// محصول جدید
function openProduct(){ document.getElementById('npErr').textContent=''; document.getElementById('npName').value=''; document.getElementById('npPrice').value=''; document.getElementById('npTrack').checked=true;
  document.getElementById('npCat').innerHTML=meta.categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  document.getElementById('npUnit').innerHTML=meta.units.map(u=>`<option value="${u.id}">${u.name}</option>`).join(''); document.getElementById('productModal').classList.remove('hidden'); }
function closeProduct(){ document.getElementById('productModal').classList.add('hidden'); }
async function saveProduct(){ document.getElementById('npErr').textContent=''; if(!document.getElementById('npName').value.trim()){document.getElementById('npErr').textContent='نام لازم است';return;}
  try{ await api('/products',{method:'POST',body:{name:document.getElementById('npName').value.trim(),category_id:Number(document.getElementById('npCat').value)||null,unit_id:Number(document.getElementById('npUnit').value)||null,base_price:document.getElementById('npPrice').value||0,track_stock:document.getElementById('npTrack').checked}});
    products=await api('/products'); closeProduct(); loadInventory(); }catch(e){ document.getElementById('npErr').textContent=e.message; } }
(async function(){ const u=await guard(['staff']); if(!u) return; mountChrome('inventory','موجودی انبار'); products=await api('/products'); live(loadInventory, 20000); })();
</script>
</body>
</html>
