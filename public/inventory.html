<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انبار</title>
  <script src="/assets/vendor/tailwind.js"></script>
  <script src="/assets/app.js"></script>
  <link rel="stylesheet" href="/assets/ui.css">
  <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
</head>
<body class="bg-dairy-bg min-h-screen pb-28 md:pb-8">
<main class="max-w-[1100px] mx-auto p-4 md:p-6 space-y-5">
  <!-- دسکتاپ: جدول -->
  <div class="hidden md:block skeu-card overflow-hidden">
    <div class="p-4 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center flex-wrap gap-2">
      <h3 class="font-bold text-gray-700">موجودی فعلی انبار</h3>
      <div class="flex gap-4">
        <span class="flex items-center gap-2 text-xs text-gray-500"><span class="w-3 h-3 rounded-full bg-green-500"></span> موجودی کافی</span>
        <span class="flex items-center gap-2 text-xs text-gray-500"><span class="w-3 h-3 rounded-full bg-red-500"></span> نیاز به شارژ</span>
      </div>
    </div>
    <div class="overflow-x-auto"><table class="w-full text-sm text-right"><thead class="bg-gray-50 text-gray-500"><tr><th class="p-4">کالا</th><th class="p-4">دسته</th><th class="p-4">واحد</th><th class="p-4">وارد شده</th><th class="p-4">خروج</th><th class="p-4">موجودی</th><th class="p-4">حد نرمال</th><th class="p-4">عملیات</th></tr></thead><tbody id="invTable" class="divide-y divide-gray-100"></tbody></table></div>
  </div>
  <!-- موبایل: کارت‌ها -->
  <div class="md:hidden space-y-3" id="invCards"></div>
</main>

<!-- FAB افزودن محصول -->
<button onclick="openProduct()" class="fixed bottom-24 md:bottom-8 left-6 z-40 w-14 h-14 bg-green-700 rounded-full flex items-center justify-center text-white shadow-2xl hover:bg-green-800"><i class="fa-solid fa-plus text-xl"></i></button>

<!-- مودال شارژ / اصلاح موجودی -->
<div id="restockModal" class="mw-modal hidden fixed inset-0 bg-black/40 flex items-end md:items-center justify-center p-0 md:p-4" style="z-index:60">
  <div class="bg-white w-full md:max-w-sm rounded-t-2xl md:rounded-2xl p-5">
    <div class="flex justify-between items-center mb-4"><h3 class="font-black text-gray-800">شارژ / اصلاح موجودی</h3><button onclick="closeRestock()" class="text-gray-400 text-2xl">&times;</button></div>
    <p id="rsName" class="text-sm text-gray-500 mb-3"></p>
    <div class="flex gap-2 mb-3">
      <button type="button" data-d="in" onclick="setDir('in')" class="dirbtn flex-1 py-3 rounded-lg border-2 font-bold"><i class="fa-solid fa-plus ml-1"></i> افزایش / شارژ</button>
      <button type="button" data-d="out" onclick="setDir('out')" class="dirbtn flex-1 py-3 rounded-lg border-2 font-bold"><i class="fa-solid fa-minus ml-1"></i> کاهش</button>
    </div>
    <div class="space-y-3">
      <div><label class="text-xs text-gray-500 block mb-1">انبار</label><select id="rsWh" class="input-skeu rounded-lg px-3 py-2.5 w-full"></select></div>
      <div><label class="text-xs text-gray-500 block mb-1">مقدار</label><input id="rsQty" type="number" inputmode="decimal" step="0.001" class="input-skeu rounded-lg px-3 py-3 w-full text-lg font-bold"></div>
      <div id="rsCostBox"><label class="text-xs text-gray-500 block mb-1">بهای واحد (اختیاری)</label><input id="rsCost" type="number" inputmode="numeric" class="input-skeu rounded-lg px-3 py-2.5 w-full"></div>
      <div id="rsNoteBox" class="hidden"><label class="text-xs text-gray-500 block mb-1">علت (اختیاری)</label><input id="rsNote" class="input-skeu rounded-lg px-3 py-2.5 w-full" placeholder="مثلاً شمارش انبار، خرابی، اشتباه ثبت"></div>
    </div>
    <div class="flex justify-end gap-2 mt-5"><button onclick="closeRestock()" class="bg-gray-100 text-gray-700 px-4 py-2.5 rounded-lg font-bold">انصراف</button><button id="rsSave" onclick="saveRestock()" class="btn-skeu text-white px-5 py-2.5 rounded-lg font-bold">ثبت</button></div>
    <p id="rsErr" class="text-red-600 text-xs mt-2"></p>
  </div>
</div>

<!-- مودال محصول جدید -->
<div id="productModal" class="mw-modal hidden fixed inset-0 bg-black/40 flex items-end md:items-center justify-center p-0 md:p-4 overflow-y-auto">
  <div class="bg-white w-full md:max-w-md rounded-t-2xl md:rounded-2xl p-5">
    <div class="flex justify-between items-center mb-4"><h3 id="npTitle" class="font-black text-gray-800">تعریف کالای جدید</h3><button onclick="closeProduct()" class="text-gray-400 text-2xl">&times;</button></div>
    <div class="space-y-3">
      <div><label class="text-xs text-gray-500 block mb-1">نام کالا *</label><input id="npName" class="input-skeu rounded-lg px-3 py-2.5 w-full"></div>
      <div class="flex gap-2">
        <div class="flex-1"><label class="text-xs text-gray-500 block mb-1">دسته</label><select id="npCat" class="input-skeu rounded-lg px-3 py-2.5 w-full"></select></div>
        <div class="flex-1"><label class="text-xs text-gray-500 block mb-1">واحد</label><select id="npUnit" class="input-skeu rounded-lg px-3 py-2.5 w-full"></select></div>
      </div>
      <div><label class="text-xs text-gray-500 block mb-1">قیمت پایه (ریال)</label><input id="npPrice" type="number" class="input-skeu rounded-lg px-3 py-2.5 w-full"></div>
      <label class="flex items-center gap-2 text-sm text-gray-600"><input id="npTrack" type="checkbox" checked class="w-4 h-4"> ردیابی موجودی</label>
    </div>
    <div class="flex justify-end gap-2 mt-5"><button onclick="closeProduct()" class="bg-gray-100 text-gray-700 px-4 py-2.5 rounded-lg font-bold">انصراف</button><button id="npSaveBtn" onclick="saveProduct()" class="btn-skeu text-white px-5 py-2.5 rounded-lg font-bold">افزودن</button></div>
    <p id="npErr" class="text-red-600 text-xs mt-2"></p>
  </div>
</div>

<script>
let products=[], warehouses=[], meta={categories:[],units:[]}, rsPid=null;
const isDairy=(p)=> p.category==='لبنیات';
const untracked=(p)=>Number(p.track_stock)===0 ? '<span class="text-[10px] bg-amber-50 text-amber-600 px-1.5 py-0.5 rounded mr-1" title="با اولین شارژ، ردیابی موجودی روشن می‌شود">بدون ردیابی</span>' : '';
const stockBtn=(p,cls)=>`<button onclick="openRestock(${p.id},'${(p.name||'').replace(/'/g,'')}')" class="${cls}"><i class="fa-solid fa-right-left ml-1"></i>شارژ / کم‌وزیاد</button>`;
async function loadInventory(){ let rows,whs,m;
  try{ [rows,whs,m]=await Promise.all([api('/inventory'),api('/inventory/warehouses'),api('/products/meta')]); }
  catch(e){ const msg=`<div class="p-6 text-center text-red-600">خطا در دریافت انبار: ${e.message}</div>`; document.getElementById('invCards').innerHTML=msg; document.getElementById('invTable').innerHTML=`<tr><td colspan="8">${msg}</td></tr>`; return; }
  warehouses=whs; meta=m;
  document.getElementById('invTable').innerHTML=rows.map(p=>{ const ok=Number(p.on_hand)>Number(p.reorder_level||0);
    return `<tr><td class="p-4 font-bold min-w-[180px]">${p.name}${untracked(p)}</td><td class="p-4">${p.category||'—'}</td><td class="p-4 text-gray-500">${p.unit||''}</td><td class="p-4">${fmt(p.total_in)}</td><td class="p-4">${fmt(p.total_out)}</td><td class="p-4 font-black ${ok?'text-green-600':'text-red-600'}">${fmt(p.on_hand)}</td><td class="p-4"><input type="number" step="0.001" value="${p.reorder_level}" onchange="setReorder(${p.id},this.value)" class="input-skeu rounded-lg px-2 py-1 w-20 text-sm" title="حد نرمال موجودی"></td><td class="p-4 whitespace-nowrap"><button onclick="openProduct(${p.id})" class="text-blue-600 font-bold text-xs ml-3" title="ویرایش"><i class="fa-solid fa-pen"></i></button>${(products.find(x=>x.id===p.id)||{}).is_raw_milk?'':`<button onclick="deleteProduct(${p.id},'${(p.name||'').replace(/'/g,'')}')" class="text-red-500 font-bold text-xs ml-3" title="حذف"><i class="fa-solid fa-trash"></i></button>`}${stockBtn(p,'text-green-700 font-bold text-xs')}</td></tr>`; }).join('')||'<tr><td colspan="8" class="p-6 text-center text-gray-400">کالایی نیست</td></tr>';
  document.getElementById('invCards').innerHTML=rows.map(p=>{ const ok=Number(p.on_hand)>Number(p.reorder_level||0), w=p.total_in>0?Math.max(4,Math.min(100,Math.round(p.on_hand/p.total_in*100))):(p.on_hand>0?100:0);
    return `<div class="skeu-card p-4" style="border-radius:20px">
      <div class="flex justify-between items-start mb-3">
        <div class="flex items-center gap-3 min-w-0 flex-1"><div class="w-10 h-10 shrink-0 ${ok?'bg-blue-50 text-blue-600':'bg-amber-50 text-amber-600'} rounded-xl flex items-center justify-center"><i class="fa-solid fa-box"></i></div>
          <div class="min-w-0"><h3 class="font-bold text-slate-800 text-sm break-words">${p.name}${untracked(p)}</h3><span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded">${p.category||'—'}</span></div></div>
        <div class="text-left shrink-0 mr-2"><span class="text-xs text-slate-400">موجودی</span><div class="text-lg font-black ${ok?'text-green-600':'text-red-600'}">${fmt(p.on_hand)} <span class="text-[10px]">${p.unit||''}</span></div></div>
      </div>
      <div class="h-1.5 w-full bg-slate-100 rounded-full overflow-hidden mb-3"><div class="h-full ${ok?'bg-green-500':'bg-red-500'} rounded-full" style="width:${w}%"></div></div>
      <div class="flex gap-2">
        <button onclick="openProduct(${p.id})" class="px-3 bg-blue-50 text-blue-600 py-2 rounded-xl font-bold text-sm" title="ویرایش"><i class="fa-solid fa-pen"></i></button>
        ${(products.find(x=>x.id===p.id)||{}).is_raw_milk?'':`<button onclick="deleteProduct(${p.id},'${(p.name||'').replace(/'/g,'')}')" class="px-3 bg-red-50 text-red-500 py-2 rounded-xl font-bold text-sm" title="حذف"><i class="fa-solid fa-trash"></i></button>`}
        ${stockBtn(p,'flex-1 bg-green-50 text-green-700 py-2 rounded-xl font-bold text-sm')}
      </div>
    </div>`; }).join('')||'<div class="text-center text-gray-400 p-8">کالایی نیست</div>'; }
// شارژ
let rsDir='in';
function setDir(d){ rsDir=d; document.querySelectorAll('.dirbtn').forEach(b=>b.className='dirbtn flex-1 py-3 rounded-lg border-2 font-bold '+(b.dataset.d===d?(d==='in'?'border-green-600 bg-green-50 text-green-700':'border-red-500 bg-red-50 text-red-600'):'border-gray-200 text-gray-500'));
  document.getElementById('rsCostBox').classList.toggle('hidden', d!=='in'); document.getElementById('rsNoteBox').classList.toggle('hidden', d==='in'); }
function openRestock(id,name){ rsPid=id; document.getElementById('rsName').textContent='کالا: '+name; document.getElementById('rsErr').textContent=''; document.getElementById('rsQty').value=''; document.getElementById('rsCost').value=''; document.getElementById('rsNote').value='';
  document.getElementById('rsWh').innerHTML=warehouses.map(w=>`<option value="${w.id}">${w.name}${w.branch_name?(' - '+w.branch_name):''}</option>`).join(''); setDir('in'); document.getElementById('restockModal').classList.remove('hidden'); }
function closeRestock(){ document.getElementById('restockModal').classList.add('hidden'); }
async function setReorder(id, val){ try{ await api('/products/'+id,{method:'PUT',body:{reorder_level:Number(val)||0}}); loadInventory(); }catch(e){ alert(e.message); } }
async function saveRestock(){ document.getElementById('rsErr').textContent=''; const q=Number(document.getElementById('rsQty').value); if(!q||q<=0){document.getElementById('rsErr').textContent='مقدار لازم است';return;}
  const wh=Number(document.getElementById('rsWh').value); if(!wh){ document.getElementById('rsErr').textContent='انباری تعریف نشده است'; return; }
  const btn=document.getElementById('rsSave'); btn.disabled=true;
  try{ if(rsDir==='in') await api('/inventory/receive',{method:'POST',body:{warehouse_id:wh,product_id:rsPid,quantity:q,unit_cost:document.getElementById('rsCost').value||null}});
    else await api('/inventory/adjust',{method:'POST',body:{warehouse_id:wh,product_id:rsPid,direction:'out',quantity:q,note:document.getElementById('rsNote').value||null}});
    closeRestock(); toast(rsDir==='in'?'شارژ شد ✓':'از موجودی کم شد ✓'); loadInventory(); }catch(e){ document.getElementById('rsErr').textContent=e.message; } finally{ btn.disabled=false; } }
// محصول جدید / ویرایش
let editId=null;
function openProduct(id){ editId = id || null;
  const p = editId ? products.find(x=>x.id===editId) : null;
  document.getElementById('npErr').textContent='';
  document.getElementById('npTitle').textContent = p ? 'ویرایش کالا' : 'تعریف کالای جدید';
  document.getElementById('npSaveBtn').textContent = p ? 'ذخیره' : 'افزودن';
  document.getElementById('npName').value = p ? (p.name||'') : '';
  document.getElementById('npPrice').value = p ? (p.base_price||'') : '';
  document.getElementById('npTrack').checked = p ? !!p.track_stock : true;
  document.getElementById('npTrack').disabled = !!p;   // تغییر ردیابی بعد از ساخت امن نیست
  document.getElementById('npCat').innerHTML=meta.categories.map(c=>`<option value="${c.id}" ${p&&p.category_id===c.id?'selected':''}>${c.name}</option>`).join('');
  document.getElementById('npUnit').innerHTML=meta.units.map(u=>`<option value="${u.id}" ${p&&p.unit_id===u.id?'selected':''}>${u.name}</option>`).join('');
  document.getElementById('productModal').classList.remove('hidden'); }
function closeProduct(){ document.getElementById('productModal').classList.add('hidden'); }
async function saveProduct(){ document.getElementById('npErr').textContent=''; const name=document.getElementById('npName').value.trim(); if(!name){document.getElementById('npErr').textContent='نام لازم است';return;}
  const body={ name, category_id:Number(document.getElementById('npCat').value)||null, unit_id:Number(document.getElementById('npUnit').value)||null, base_price:document.getElementById('npPrice').value||0 };
  try{
    if(editId){ await api('/products/'+editId,{method:'PUT',body}); }
    else { body.track_stock=document.getElementById('npTrack').checked; await api('/products',{method:'POST',body}); }
    products=await api('/products'); closeProduct(); loadInventory();
  }catch(e){ document.getElementById('npErr').textContent=e.message; } }
async function deleteProduct(id,name){ if(!confirm('کالای «'+name+'» حذف شود؟'))return;
  try{ const r=await api('/products/'+id,{method:'DELETE',body:{reason:'حذف دستی'}});
    toast(r.archived?'کالا بایگانی و از لیست حذف شد (در سوابق استفاده شده بود)':'کالا حذف شد');
    products=await api('/products'); loadInventory();
  }catch(e){ toast(e.message,'err'); } }
(async function(){ const u=await guard(['staff']); if(!u) return; mountChrome('inventory','موجودی انبار'); try{ products=await api('/products'); }catch(e){ toast(e.message,'err'); } live(loadInventory, 20000); })();
</script>
</body>
</html>
