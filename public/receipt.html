<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فاکتور</title>
  <script src="/assets/vendor/tailwind.js"></script>
  <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
  <script src="/assets/vendor/qrious.min.js"></script>
  <style>
    @font-face{font-family:'Vazirmatn';src:url('/assets/fonts/Vazirmatn.ttf') format('truetype');font-weight:100 900;font-display:swap;}
    body { font-family:'Vazirmatn',sans-serif; background:#f1f5f9; }
    .receipt-card { background:#fff; border-radius:24px; box-shadow:0 10px 25px -5px rgba(0,0,0,.08); }
    /* چاپ: سیاه‌سفید، بدون خاکستری و بدون پس‌زمینه */
    @media print {
      .no-print{ display:none!important; }
      body{ background:#fff!important; padding:0; }
      .receipt-card{ box-shadow:none!important; border-radius:0; }
      .receipt-card *{ color:#000!important; background:transparent!important; border-color:#000!important; box-shadow:none!important; }
      @page{ margin:6mm; }
    }
  </style>
</head>
<body class="p-4 pb-28">
  <header class="no-print flex items-center justify-between mb-6 max-w-md mx-auto">
    <button onclick="history.length>1?history.back():window.close()" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-slate-500 shadow-sm"><i class="fa-solid fa-chevron-right"></i></button>
    <h1 id="docTitle" class="font-black text-slate-800">جزئیات فاکتور</h1>
    <span class="w-10"></span>
  </header>

  <main id="card" class="receipt-card p-6 relative overflow-hidden max-w-md mx-auto">
    <div class="text-center text-slate-400 py-16">در حال بارگذاری…</div>
  </main>

  <footer class="no-print fixed bottom-0 left-0 right-0 p-4 bg-white/85 backdrop-blur-md flex gap-3 max-w-md mx-auto">
    <button onclick="window.print()" class="flex-1 bg-green-700 text-white py-4 rounded-2xl font-black shadow-lg flex items-center justify-center gap-2"><i class="fa-solid fa-print"></i> چاپ فاکتور</button>
  </footer>

<script>
  const fmt=(n)=>Number(n||0).toLocaleString('fa-IR');
  // حالت: /r/<token> (عمومی) یا ?id=<id> (کارمند/صاحب)
  const pathToken=(location.pathname.match(/^\/r\/([0-9a-f]{32})/)||[])[1];
  const qid=new URLSearchParams(location.search).get('id');
  (async()=>{
    const card=document.getElementById('card');
    try{
      let d;
      if(pathToken){ const r=await fetch('/api/public/receipt/'+pathToken); if(!r.ok) throw new Error('فاکتور یافت نشد'); d=await r.json(); }
      else { const r=await fetch('/api/receipts/'+qid,{credentials:'same-origin'}); if(!r.ok) throw new Error('عدم دسترسی به فاکتور'); d=await r.json(); }
      const rc=d.receipt;
      let rows='';
      if(d.milk){ const lbl=d.milk.shift==='morning'?'شیر صبح (دامدار)':'شیر شب (دامدار)';
        rows+=`<div class="flex justify-between items-center"><div><h3 class="font-bold text-slate-800 text-sm">${lbl}</h3><p class="text-[10px] text-slate-400">${fmt(d.milk.weight_kg)} کیلوگرم × ${fmt(d.milk.price_per_kg)}${d.milk.fat_pct!=null?(' | چربی '+fmt(d.milk.fat_pct)+'٪'):''}</p></div><span class="font-black text-green-600 text-sm">+${fmt(d.milk.amount)}</span></div>`; }
      (d.items||[]).forEach(i=>{ rows+=`<div class="flex justify-between items-center"><div><h3 class="font-bold text-slate-800 text-sm">${i.product_name}</h3><p class="text-[10px] text-slate-400">${fmt(i.quantity)} ${i.unit||''} × ${fmt(i.unit_price)}</p></div><span class="font-black text-red-600 text-sm">-${fmt(i.amount)}</span></div>`; });
      const qrUrl=location.origin+'/r/'+rc.public_token;
      const LOGO=await fetch('/api/public/logo').then(r=>r.ok?r.json():{}).then(x=>x.logo).catch(()=>null);
      card.innerHTML=`
        <div class="absolute -top-3 left-0 right-0 flex justify-around">${'<div class="w-6 h-6 rounded-full bg-[#f1f5f9]"></div>'.repeat(5)}</div>
        <div class="text-center mt-4 mb-8">
          ${LOGO?`<img src="${LOGO}" class="w-16 h-16 object-contain mx-auto mb-4">`:`<div class="w-16 h-16 bg-green-50 text-green-700 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl"><i class="fa-solid fa-receipt"></i></div>`}
          <h2 class="text-xl font-black text-slate-800">${d.branch?.name||'سامانه لبنیات'}</h2>
          <p class="text-xs text-slate-400 mt-1">شماره فاکتور: ${rc.receipt_no}</p>
        </div>
        <div class="space-y-4 border-b border-dashed border-slate-200 pb-6 mb-6 text-sm">
          <div class="flex justify-between"><span class="text-slate-400">تاریخ ثبت:</span><span class="font-bold text-slate-800">${rc.issued_at_jalali}</span></div>
          <div class="flex justify-between"><span class="text-slate-400">طرف حساب:</span><span class="font-bold text-slate-800">${d.person.fullname} (${d.person.person_code})</span></div>
        </div>
        <div class="space-y-4 mb-8">${rows||'<p class="text-center text-slate-400 text-sm">قلمی ثبت نشده</p>'}</div>
        <div class="bg-slate-50 p-4 rounded-2xl space-y-3">
          <div class="flex justify-between text-xs"><span class="text-slate-500">جمع بستانکار (شیر):</span><span class="font-bold">${fmt(rc.milk_amount)}</span></div>
          <div class="flex justify-between text-xs"><span class="text-slate-500">جمع بدهکار (خرید):</span><span class="font-bold">${fmt(rc.purchase_amount)}</span></div>
          <div class="flex justify-between items-center border-t border-slate-200 pt-3"><span class="font-black text-slate-800">خالص فاکتور:</span><span class="text-xl font-black text-green-700">${fmt(rc.net_amount)} <span class="text-[10px]">ریال</span></span></div>
        </div>
        <div class="mt-8 text-center"><canvas id="qr" class="mx-auto"></canvas><p id="qrLink" class="text-[10px] text-slate-400 mt-2 font-bold tracking-widest">اسکن برای مشاهدهٔ فاکتور · MILKWEAR</p></div>
        <div class="mt-6 pt-4 border-t border-dashed border-slate-200 text-center text-[11px] text-slate-500 leading-6">
          ${d.branch?.phone?`<div dir="ltr"><i class="fa-solid fa-phone ml-1"></i> ${d.branch.phone}</div>`:''}
          ${d.branch?.address?`<div><i class="fa-solid fa-location-dot ml-1"></i> ${d.branch.address}</div>`:''}
        </div>`;
      try {
        if(window.QRious){ new QRious({ element:document.getElementById('qr'), value:qrUrl, size:120, foreground:'#000000', background:'#ffffff', level:'M' }); }
        else { document.getElementById('qrLink').textContent = qrUrl; }
      } catch(err){ document.getElementById('qrLink').textContent = qrUrl; }
      if(qid) fetch('/api/receipts/'+qid+'/printed',{method:'POST',credentials:'same-origin'}).catch(()=>{});
      // چاپ مستقیم: با ?print=1 خودکار پرینت می‌گیرد و پنجره بسته می‌شود
      if(new URLSearchParams(location.search).get('print')==='1'){
        window.addEventListener('afterprint',()=>{ setTimeout(()=>window.close(),200); });
        setTimeout(()=>window.print(),350);
      }
    }catch(e){ card.innerHTML='<div class="text-center text-red-500 py-16">'+e.message+'</div>'; }
  })();
</script>
</body>
</html>
