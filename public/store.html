<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صندوق فروش</title>
  <script src="/assets/vendor/tailwind.js"></script>
  <script src="/assets/app.js"></script>
  <link rel="stylesheet" href="/assets/ui.css">
  <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
</head>
<body class="bg-dairy-bg min-h-screen pb-28 md:pb-8">
<main class="max-w-[1100px] mx-auto p-4 md:p-6 space-y-5">
  <div class="flex justify-between items-center flex-wrap gap-2">
    <h2 class="text-xl font-bold text-gray-800">🏪 صندوق فروش فروشگاه</h2>
    <div class="text-sm text-gray-500">فروش امروز: <b id="todaySales" class="text-amber-700">—</b> ریال</div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
    <!-- سبد فروش -->
    <div class="lg:col-span-2 skeu-card p-5 space-y-4">
      <!-- مشتری -->
      <div>
        <label class="text-xs text-gray-500 block mb-1">مشتری</label>
        <div class="flex gap-2">
          <div class="relative flex-1">
            <input id="custSearch" oninput="searchCust()" placeholder="جستجوی مشتری..." class="input-skeu rounded-lg px-3 py-2.5 w-full">
            <div id="custResults" class="hidden absolute z-20 bg-white border border-gray-200 rounded-lg mt-1 w-full max-h-52 overflow-y-auto shadow-lg"></div>
          </div>
          <button onclick="walkIn()" class="bg-gray-100 px-3 rounded-lg text-sm font-bold whitespace-nowrap">مشتری نقدی</button>
        </div>
        <div id="custChip" class="hidden mt-2 inline-flex items-center gap-2 bg-green-50 text-green-800 px-3 py-1.5 rounded-full text-sm font-bold"></div>
      </div>
      <!-- اقلام -->
      <div>
        <div class="flex justify-between items-center mb-2"><label class="text-xs text-gray-500">اقلام فروش</label><button onclick="addRow()" class="text-green-700 font-bold text-sm">+ افزودن قلم</button></div>
        <div id="cart" class="space-y-2"></div>
      </div>
      <!-- پرداخت -->
      <div>
        <label class="text-xs text-gray-500 block mb-2">روش پرداخت</label>
        <div class="flex gap-2">
          <button data-m="cash" onclick="setPay('cash')" class="paybtn flex-1 py-2.5 rounded-xl border-2 font-bold text-sm border-green-600 bg-green-50 text-green-700">نقدی</button>
          <button data-m="card" onclick="setPay('card')" class="paybtn flex-1 py-2.5 rounded-xl border-2 font-bold text-sm border-gray-200 text-gray-500">کارت</button>
          <button data-m="credit" onclick="setPay('credit')" class="paybtn flex-1 py-2.5 rounded-xl border-2 font-bold text-sm border-gray-200 text-gray-500">نسیه</button>
        </div>
      </div>
    </div>
    <!-- خلاصه و ثبت -->
    <div class="skeu-card p-5 h-fit sticky top-24">
      <h3 class="font-bold text-gray-700 mb-4">جمع فاکتور</h3>
      <div class="text-3xl font-black text-green-700 mb-1"><span id="cartTotal">۰</span> <span class="text-sm">ریال</span></div>
      <p id="payHint" class="text-xs text-gray-400 mb-4">پرداخت: نقدی</p>
      <button onclick="checkout()" class="btn-skeu text-white w-full py-3.5 rounded-xl font-black text-lg">ثبت فروش و چاپ بارنامه</button>
      <p id="posErr" class="text-red-600 text-xs mt-2"></p>
    </div>
  </div>

  <!-- فروش‌های امروز -->
  <div class="skeu-card overflow-hidden">
    <div class="p-4 border-b border-gray-100 bg-gray-50/50"><h3 class="font-bold text-gray-700">فروش‌های اخیر فروشگاه</h3></div>
    <div class="overflow-x-auto"><table class="w-full text-sm text-right"><thead class="bg-gray-50 text-gray-500"><tr><th class="p-3">شماره</th><th class="p-3">مشتری</th><th class="p-3">مبلغ</th><th class="p-3">فاکتور</th></tr></thead><tbody id="salesTable" class="divide-y divide-gray-100"></tbody></table></div>
  </div>
</main>
<script>
let products=[], warehouse=null, branchId=null, cust=null, payMethod='cash', walkinId=null;
async function searchCust(){ const q=document.getElementById('custSearch').value.trim(); const box=document.getElementById('custResults');
  if(!q){ box.classList.add('hidden'); return; }
  const list=await api('/persons?q='+encodeURIComponent(q));
  box.innerHTML=list.map(p=>`<div class="p-2.5 hover:bg-gray-50 cursor-pointer text-sm" onclick="pickCust(${p.id},'${(p.fullname||'').replace(/'/g,'')}','${p.person_code}')">${p.fullname} <span class="text-gray-400 text-xs">(${p.person_code})</span></div>`).join('')||'<div class="p-2.5 text-gray-400 text-sm">موردی نیست</div>';
  box.classList.remove('hidden'); }
function pickCust(id,name,code){ cust={id,name,code}; document.getElementById('custResults').classList.add('hidden'); document.getElementById('custSearch').value='';
  const chip=document.getElementById('custChip'); chip.innerHTML=`<i class="fa-solid fa-user"></i> ${name} (${code}) <button onclick="clearCust()" class="text-green-600">&times;</button>`; chip.classList.remove('hidden'); }
function clearCust(){ cust=null; document.getElementById('custChip').classList.add('hidden'); }
async function walkIn(){ try{ if(!walkinId){ const list=await api('/persons?q=مشتری نقدی'); const found=list.find(p=>p.fullname==='مشتری نقدی');
    if(found) walkinId=found.id; else { const r=await api('/persons',{method:'POST',body:{fullname:'مشتری نقدی',roles:['customer']}}); walkinId=r.id; } }
  pickCust(walkinId,'مشتری نقدی','—'); }catch(e){ alert(e.message); } }
function addRow(){ const div=document.createElement('div'); div.className='flex gap-2 items-center';
  div.innerHTML=`<select class="c-prod input-skeu rounded-lg px-2 py-2 flex-1"><option value="">— کالا —</option>${products.map(p=>`<option value="${p.id}" data-price="${p.base_price}">${p.name} (${fmt(p.base_price)})</option>`).join('')}</select>
    <input class="c-qty input-skeu rounded-lg px-2 py-2 w-20" type="number" step="0.001" placeholder="تعداد" value="1" oninput="calc()">
    <input class="c-price input-skeu rounded-lg px-2 py-2 w-28" type="number" placeholder="قیمت" oninput="calc()">
    <button class="text-red-500 px-2" onclick="this.parentElement.remove();calc()">&times;</button>`;
  document.getElementById('cart').appendChild(div);
  div.querySelector('.c-prod').onchange=(e)=>{ div.querySelector('.c-price').value=e.target.selectedOptions[0]?.dataset.price||''; calc(); }; }
function readCart(){ return [...document.getElementById('cart').children].map(r=>({product_id:Number(r.querySelector('.c-prod').value),quantity:Number(r.querySelector('.c-qty').value),unit_price:r.querySelector('.c-price').value===''?null:Number(r.querySelector('.c-price').value)})).filter(x=>x.product_id&&x.quantity>0); }
function calc(){ const t=[...document.getElementById('cart').children].reduce((s,r)=>{const p=Number(r.querySelector('.c-price').value)||0,q=Number(r.querySelector('.c-qty').value)||0;return s+Math.round(p*q);},0); document.getElementById('cartTotal').textContent=fmt(t); }
function setPay(m){ payMethod=m; document.querySelectorAll('.paybtn').forEach(b=>b.className='paybtn flex-1 py-2.5 rounded-xl border-2 font-bold text-sm '+(b.dataset.m===m?'border-green-600 bg-green-50 text-green-700':'border-gray-200 text-gray-500'));
  document.getElementById('payHint').textContent='پرداخت: '+({cash:'نقدی',card:'کارت',credit:'نسیه (به حساب مشتری)'}[m]); }
async function checkout(){ document.getElementById('posErr').textContent='';
  if(!cust){ document.getElementById('posErr').textContent='مشتری را انتخاب کنید'; return; }
  const items=readCart(); if(!items.length){ document.getElementById('posErr').textContent='حداقل یک قلم کالا لازم است'; return; }
  try{ const r=await api('/receipts',{method:'POST',body:{person_id:cust.id, channel:'store', warehouse_id:warehouse, branch_id:branchId, items, paid:(payMethod!=='credit'), payment_method:payMethod}});
    document.getElementById('cart').innerHTML=''; addRow(); calc(); clearCust();
    // فروش ثبت شد → فاکتور خودکار به صف چاپِ سرور رفت (پرینت‌ایجنت چاپ می‌کند)
    toast('فروش ثبت شد و فاکتور به صف چاپ رفت 🖨');
    loadSales();
  }catch(e){ document.getElementById('posErr').textContent=e.message; } }
async function reprintReceipt(id){ try{ await api('/print/receipt/'+id,{method:'POST'}); toast('فاکتور دوباره به صف چاپ رفت 🖨'); }catch(e){ toast(e.message,'err'); } }
async function loadSales(){ const [d, whs, orders]=await Promise.all([api('/dashboard'), api('/inventory/warehouses'), api('/orders?channel=store')]);
  document.getElementById('todaySales').textContent=fmt(d.store.value);
  if(!warehouse && whs.length){ const st=whs.find(w=>/فروشگاه|store/i.test(w.name))||whs[0]; warehouse=st.id; }
  document.getElementById('salesTable').innerHTML=orders.slice(0,30).map(o=>`<tr><td class="p-3 font-bold">${o.order_no}</td><td class="p-3">${o.fullname}</td><td class="p-3">${fmt(o.total_amount)}</td><td class="p-3">${o.receipt_id?`<button onclick="reprintReceipt(${o.receipt_id})" class="text-blue-600" title="چاپ مجدد"><i class="fa-solid fa-print"></i></button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="4" class="p-6 text-center text-gray-400">فروشی نیست</td></tr>'; }
(async function(){ const u=await guard(['staff']); if(!u) return; mountChrome('store','صندوق فروش');
  branchId=u.branch_id||null; products=await api('/products'); addRow(); setPay('cash'); loadSales(); })();
</script>
</body>
</html>
